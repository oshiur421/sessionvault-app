name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Restore binary files not stored in the text-only push
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar
          python3 -c "import sys; print(sys.version)"
          pip install pillow -q
          python3 - << 'PY'
          from PIL import Image
          import os
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              img = Image.new('RGB', (size, size), (232, 89, 12))
              img.save(os.path.join(path, 'ic_launcher.png'))
          print('launcher icons generated')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze || true
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sessionvault-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
